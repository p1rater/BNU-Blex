# BlexOS Boot Logging Configuration
# log.cfg — read by /init at startup
#
# Log levels (highest to lowest):
#   EMERG   0  system is unusable
#   ALERT   1  action must be taken immediately
#   CRIT    2  critical conditions
#   ERR     3  error conditions
#   WARN    4  warning conditions
#   NOTICE  5  normal but significant
#   INFO    6  informational
#   DEBUG   7  debug-level messages
#   TRACE   8  trace-level (max verbosity)

# Minimum log level to display on screen
# Messages below this level are suppressed
LOG_LEVEL=6

# Log to serial port (1=yes, 0=no)
LOG_SERIAL=1

# Show boot logo (1=yes, 0=no)
BOOT_LOGO=1

# Logo display duration after boot (seconds)
LOGO_DURATION=3

# Boot delay (milliseconds, 0 = no delay)
BOOT_DELAY_MS=0
